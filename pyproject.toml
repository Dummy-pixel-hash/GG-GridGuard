[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gridguard"
version = "0.1.0"
description = "GridGuard risk engine — deterministic 0-100 composite risk scoring per grid asset"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-v"
