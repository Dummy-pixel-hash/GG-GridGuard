submission:
  title: "GridGuard — Grid Asset Intelligence & Maintenance Prioritization"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Transformer and substation failures cause blackouts costing utilities over
    $1M per hour and affecting millions of people, yet most utilities still
    schedule maintenance by calendar rather than condition. Sensors already
    measuring temperature, vibration, partial discharge, and oil quality show
    failure signatures weeks in advance, and weather events compound the
    risk — but sensor data, weather forecasts, and incident history are never
    combined in time to act.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GridGuard is a standalone grid asset intelligence and maintenance-prioritization
    system that fuses asset sensor telemetry, Open-Meteo weather forecasts,
    historical incident records, and each asset's degradation and lifecycle state
    into a deterministic 0–100 risk score per asset. Assets are then ranked by
    combined risk and grid impact (customers served, critical facilities, load,
    downstream cascade, redundancy) to produce a prioritized maintenance plan and
    crew pre-positioning recommendations, with a conversational AI assistant that
    explains risk factors and recommended actions — all grounded in the engine's
    computed scores, never invented by the LLM.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Hardened deterministic risk engine: per-asset 0–100 composite score from five auditable components — sensor health (30%), weather risk (20%), historical failure (15%), asset degradation (15%), grid impact (20%) — with Normal/Watch/High/Critical bands; includes MTBF sub-signal, current load scoring, corrected cold-stress threshold, and a raised missing-sensor safety floor (all-blind asset scores ≥40 on sensor component)"
    - "Live weather integration: staged static storm scenario by default for a reproducible demo; opt-in live Open-Meteo 72-hour refresh per asset at startup via GRIDGUARD_LIVE_WEATHER=1 (best-effort; static demo data kept on network failure); storm_warning_level derived from actual wind/precipitation via classify_storm_level"
    - "Grid-impact-aware maintenance prioritization and crew pre-positioning: assets ranked by overall risk with grid-impact tie-break (customers, critical facilities, peak load, downstream cascade, N-1 redundancy) into a day's work order list with region-level crew staging recommendations for storm-exposed, high-consequence assets"
    - "Asset lifecycle management with preserved lineage: replacement retires the old asset with full fault/maintenance history intact, spawns a clean-state successor linked by predecessor_asset_id; advance_age is stateless (overdue managed by maintenance events, not age ticks)"
    - "Conversational AI operator assistant: grounded in engine outputs, conversation history across turns, tone-adaptive responses, offline mock fallback, configurable to any OpenAI-compatible endpoint or IBM watsonx.ai"

  tech_stack:
    languages:
      - "Python 3.10+"
    frameworks:
      - "stdlib only (no third-party runtime dependencies)"
    ibm_technologies:
      - "IBM Bob (hackathon development interface — optional at runtime)"
      - "IBM watsonx.ai (optional LLM provider — GRIDGUARD_LLM_PROVIDER=watsonx)"
    databases:
      - "SQLite (stdlib sqlite3)"
    other:
      - "Open-Meteo API (weather forecasts — no API key required)"
      - "openai Python SDK (optional — only needed for OpenAIProvider)"

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    GridGuard does not treat failure prediction as a black box. Four data silos
    utilities already own — sensor telemetry, live weather forecasts, incident
    history, and asset lifecycle state — are fused into one explainable ranking
    that tells an operator not just which asset is most likely to fail, but
    which failure would hurt the grid most, why, and what to do about it today.
    Every scoring formula is independently auditable: cold-stress uses a
    physically correct 0 °C neutral, MTBF drives the historical-failure score,
    missing sensors raise risk rather than hiding it, and current load is
    reflected in the sensor component. Weather scores use the staged static
    storm scenario by default (opt-in live Open-Meteo refresh at startup).
    The AI assistant explains the engine's output in plain
    language, maintains context across follow-ups, and falls back to a
    deterministic grounded response if the LLM is unavailable. The whole system
    runs on the Python standard library — no pip install, immediately reproducible.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Risk weights (sensor 30%, weather 20%, historical failure 15%, degradation 15%,
    grid impact 20%) are tunable design parameters, not validated against a real
    utility failure corpus — no labeled dataset was available at hackathon scale.
    The demo runs on 8 synthetic assets; no real utility data or customer PII is
    included. The weather × condition interaction is additive rather than
    multiplicative (a degraded asset in a storm scores the sum, not the product);
    a cross-component multiplier is a natural next step. GridGuard runs as a
    standalone application.

